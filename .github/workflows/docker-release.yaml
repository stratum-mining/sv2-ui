name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      # On a release event this checks the tagged release commit, which comes
      # from the release/vX branch and contains its pinned sv2-apps images.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Smoke-test generated configs against selected sv2-apps images
        run: npm run check:sv2-app-config

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: stratumv2
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tags
        id: tags
        run: |
          TAGS="stratumv2/sv2-ui:${GITHUB_REF_NAME}"

          if [ "${{ github.event_name }}" = "release" ]; then
            TAGS="$TAGS,stratumv2/sv2-ui:latest"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          file: Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            SV2_UI_VERSION=${{ github.ref_name }}
            SV2_UI_COMMIT=${{ github.sha }}
